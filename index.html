<!DOCTYPE html>
<html lang="en" class="bg-background">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join Our Telegram Channel</title>
  <meta name="description" content="Get instant updates, exclusive content and the latest information directly on Telegram. Join now." />
  <style>
    :root {
      --bg: #f6f8fc;
      --card: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --brand: #2f6bff;
      --brand-2: #7c4dff;
      --ring: rgba(47, 107, 255, 0.35);
      --border: rgba(15, 23, 42, 0.08);
      --shadow: 0 30px 60px -20px rgba(37, 60, 120, 0.28);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Premium radial + floating gradient background */
    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);
      z-index: 0;
      opacity: 0.55;
      pointer-events: none;
    }
    body::before {
      width: 460px; height: 460px;
      background: radial-gradient(circle at 30% 30%, #8fb2ff, transparent 70%);
      top: -140px; left: -120px;
      animation: float1 14s ease-in-out infinite;
    }
    body::after {
      width: 420px; height: 420px;
      background: radial-gradient(circle at 70% 70%, #c6b3ff, transparent 70%);
      bottom: -140px; right: -120px;
      animation: float2 16s ease-in-out infinite;
    }

    @keyframes float1 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(40px, 30px); }
    }
    @keyframes float2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-40px, -30px); }
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 40px 28px 28px;
      box-shadow: var(--shadow);
      text-align: center;
      backdrop-filter: saturate(180%) blur(6px);
      animation: cardIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Logo */
    .logo-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 84px; height: 84px;
      border-radius: 22px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      box-shadow: 0 14px 30px -10px var(--ring);
      margin-bottom: 22px;
      overflow: hidden;
      animation: pop 0.7s 0.1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(0.7); }
      to { opacity: 1; transform: scale(1); }
    }

    h1 {
      font-size: clamp(1.6rem, 6vw, 2.05rem);
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      text-wrap: balance;
    }

    .sub {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.55;
      max-width: 340px;
      margin: 0 auto 26px;
      text-wrap: pretty;
    }

    /* Countdown */
    .countdown {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 26px;
    }
    .ring {
      position: relative;
      width: 132px; height: 132px;
    }
    .ring svg { transform: rotate(-90deg); display: block; }
    .ring .track { stroke: rgba(47, 107, 255, 0.12); }
    .ring .bar {
      stroke: url(#grad);
      stroke-linecap: round;
      transition: stroke-dashoffset 1s linear;
    }
    .ring .num {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .ring .num span { animation: tick 1s ease; display: inline-block; }
    @keyframes tick {
      0% { opacity: 0; transform: translateY(8px) scale(0.85); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .cd-text { font-size: 0.95rem; color: var(--ink); font-weight: 600; }
    .cd-hint { font-size: 0.85rem; color: var(--muted); margin-top: -6px; }

    /* CTA */
    .cta {
      position: relative;
      width: 100%;
      border: none;
      cursor: pointer;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      padding: 16px 20px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      box-shadow: 0 16px 30px -12px var(--ring);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }
    .cta::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 16px;
      box-shadow: 0 0 0 0 var(--ring);
      animation: glow 2.4s ease-in-out infinite;
    }
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(47, 107, 255, 0.35); }
      50% { box-shadow: 0 0 0 10px rgba(47, 107, 255, 0); }
    }
    .cta:hover { transform: translateY(-2px); filter: brightness(1.05); }
    .cta:active { transform: translateY(0) scale(0.98); }
    .cta svg { width: 22px; height: 22px; }

    /* Trust */
    .trust {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 18px;
      margin-top: 20px;
    }
    .trust li {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 500;
    }
    .trust li svg { width: 16px; height: 16px; color: var(--brand); }

    /* Footer */
    footer {
      margin-top: 26px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.7;
    }
    footer a {
      color: var(--brand);
      font-weight: 600;
      text-decoration: none;
    }
    footer a:hover { text-decoration: underline; }

    @media (max-width: 360px) {
      .card { padding: 32px 20px 22px; border-radius: 24px; }
      .ring { width: 116px; height: 116px; }
      .ring .num { font-size: 2.2rem; }
    }
  </style>
</head>
<body>
  <main class="card" aria-labelledby="title">
    <div class="logo-wrap">
      <img src="logo.png" alt="Channel logo" />
    </div>

    <h1 id="title">Join Our Telegram Channel</h1>
    <p class="sub">Get instant updates, exclusive content and the latest information directly on Telegram.</p>

    <div class="countdown" aria-live="polite">
      <div class="ring">
        <svg width="132" height="132" viewBox="0 0 132 132" aria-hidden="true">
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#2f6bff" />
              <stop offset="100%" stop-color="#7c4dff" />
            </linearGradient>
          </defs>
          <circle class="track" cx="66" cy="66" r="58" fill="none" stroke-width="8" />
          <circle class="bar" id="bar" cx="66" cy="66" r="58" fill="none" stroke-width="8" />
        </svg>
        <div class="num" id="num"><span>10</span></div>
      </div>
      <p class="cd-text">Redirecting to Telegram…</p>
      <p class="cd-hint">Please wait…</p>
    </div>

    <button class="cta" id="joinBtn" type="button" aria-label="Join our Telegram channel now">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M21.94 4.6 18.9 19.2c-.23 1.02-.84 1.27-1.7.79l-4.7-3.47-2.27 2.18c-.25.25-.46.46-.94.46l.34-4.78 8.7-7.86c.38-.34-.08-.53-.59-.19L6.99 13.2l-4.64-1.45c-1.01-.32-1.03-1.01.21-1.5l18.14-6.99c.84-.31 1.58.2 1.24 1.34Z"/>
      </svg>
      JOIN TELEGRAM
    </button>

    <ul class="trust">
      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Fast Access</li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Free to Join</li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Instant Updates</li>
    </ul>

    <footer>
      <div>&copy; 2026 &bull; All Rights Reserved</div>
      <div>Advertise with <a id="agencyLink" href="https://telegram.me/+gZcHbMz22XcyN2Y1" target="_blank" rel="noopener noreferrer">Snow </a></div>
    </footer>
  </main>

  <script>
    /* ============================================================
       EDIT THESE THREE VALUES ONLY
       ============================================================ */
    const TELEGRAM_URL = "https://t.me/+T8e3zs5LKxFmZGU1"; // 1. Telegram link
    const AGENCY_URL = "https://telegram.me/+gZcHbMz22XcyN2Y1";          // 2. Agency link
    const COUNTDOWN_SECONDS = 10;                      // 3. Countdown duration
    /* ============================================================ */

    (function () {
      const bar = document.getElementById("bar");
      const num = document.getElementById("num");
      const joinBtn = document.getElementById("joinBtn");
      const agencyLink = document.getElementById("agencyLink");

      const R = 58;
      const CIRC = 2 * Math.PI * R;
      bar.style.strokeDasharray = CIRC;
      bar.style.strokeDashoffset = 0;

      let remaining = COUNTDOWN_SECONDS;
      let timer = null;
      let redirected = false;
      let cancelled = false;

      function render() {
        num.innerHTML = "<span>" + remaining + "</span>";
        const progress = remaining / COUNTDOWN_SECONDS;
        bar.style.strokeDashoffset = CIRC * (1 - progress);
      }

      function goToTelegram() {
        if (redirected || cancelled) return;
        redirected = true;
        window.location.href = TELEGRAM_URL;
      }

      function stopCountdown() {
        cancelled = true;
        if (timer) { clearInterval(timer); timer = null; }
      }

      function tick() {
        remaining -= 1;
        if (remaining <= 0) {
          remaining = 0;
          render();
          stopCountdown();
          goToTelegram();
          return;
        }
        render();
      }

      // Init
      num.querySelector("span").textContent = COUNTDOWN_SECONDS;
      render();
      if (!timer) timer = setInterval(tick, 1000);

      // Manual join
      joinBtn.addEventListener("click", function () {
        stopCountdown();
        redirected = false; // allow manual navigation
        window.location.href = TELEGRAM_URL;
      });

      // Agency link: opens in new tab, cancels the Telegram redirect
      agencyLink.href = AGENCY_URL;
      agencyLink.addEventListener("click", function () {
        stopCountdown();
      });
    })();
  </script>
</body>
